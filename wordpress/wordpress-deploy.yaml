apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deploy
spec:
  selector:
    matchLabels:
      app: wordpress
  strategy:
      type: Recreate
  template:
      metadata:
        labels:
          app: wordpress
      spec:
        containers:
        - image: wordpress:latest
          name: wordpress-con
          env:
          - name: WORDPRESS_DB_HOST
            value: "mysql-svc"
          - name: WORDPRESS_DB_USER
            value: "chitti"
          - name: WORDPRESS_DB_PASSWORD
            value: "root123"
          - name: WORDPRESS_DB_NAME
            value: "db_01"
          ports:
          - containerPort: 80
