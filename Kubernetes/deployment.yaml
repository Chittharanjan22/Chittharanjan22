apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: aks-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
          env:
            - name: GREETING_MESSAGE   
              valueFrom:
                configMapKeyRef:
                  name: my-config   
                  key: greetings
            - name: MYSQL_ROOT_PASSWORD   
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: MYSQL_ROOT_PASSWORD













    
   

 


